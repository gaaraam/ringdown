# appointmentLabel은 원래 예약 안내용, appointmentTime/resolution은 현재 업무 상태.
routes:
  - op: GET /patients/{patientId}
    action: read
    collection: patients
    key: patientId
  - op: GET /appointments/{patientId}
    action: read
    collection: appointments
    key: patientId
  - op: PUT /appointments/{patientId}/time
    action: patch
    collection: appointments
    key: patientId
  - op: PUT /appointments/{patientId}/cancellation
    action: patch
    collection: appointments
    key: patientId
